<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Healer – Discover Your Inner Compass</title>
  <link rel="icon" href="images/healer-logo.webp">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Gabarito:wght@400..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body class="center-layout">

  <div class="intro-container">
    <img src="images/healer-logo.webp" alt="Healer logo" class="brand-logo">
    <div class="brand-title">Healer</div>

    <div class="kicker-line-wrap">
      <span class="kicker-text">Inner core quiz</span>
    </div>

    <h1 class="hero-heading">Discover Your Inner Compass</h1>
    <p class="hero-desc">
      Based on forced-choice priority theory, this assessment uncovers the non-negotiable principles that anchor your
      life, decisions and emotional peace.
    </p>

    <form action="pick-cards.html" method="GET" class="intro-form">
      <label class="input-label-kicker" for="userName">Enter your name to begin</label>
      <input type="text" id="userName" name="userName" class="name-input" placeholder="Your name…" maxlength="30"
        required autocomplete="off">
      <div class="btn-wrap">
        <button type="submit" class="btn-pill">Start quiz &rarr;</button>
      </div>
    </form>
  </div>

</body>

</html>
